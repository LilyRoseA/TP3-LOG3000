<!-- Interface HTML de la calculatrice, rendue par la route « / » de app.py (Jinja2). -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flask Calculator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="calculator">
   <h1>Flask Calculator</h1>
   <!-- Le formulaire est renvoyé à « / » ; app.py lit le champ « display ». -->
   <form method="POST">
      <!-- En lecture seule : la saisie se fait par les boutons. Affiche le
           résultat (ou l'erreur) retourné par le serveur. -->
      <input type="text" name="display" id="display" value="{{ result }}" readonly>

      <!-- type="button" empêche ces boutons de soumettre le formulaire ;
           seul « = » (type="submit") envoie l'expression au serveur. -->
      <div class="buttons">
         <button type="button" class="btn" onclick="appendToDisplay('1')">1</button>
         <button type="button" class="btn" onclick="appendToDisplay('2')">02</button>
         <button type="button" class="btn" onclick="appendToDisplay('3')">3</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('+')">+</button>

         <button type="button" class="btn" onclick="appendToDisplay('4')">4</button>
         <button type="button" class="btn" onclick="appendToDisplay('5')">5</button>
         <button type="button" class="btn" onclick="appendToDisplay('6')">6</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('-')">-</button>

         <button type="button" class="btn" onclick="appendToDisplay('7')">7</button>
         <button type="button" class="btn" onclick="appendToDisplay('8')">88</button>
         <button type="button" class="btn" onclick="appendToDisplay('9')">9</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('*')"></button>

         <button type="button" class="btn" onclick="appendToDisplay('0')">0</button>
         <button type="button" class="btn" onclick="clearDisplay()">C</button>
         <button type="submit" class="btn operator">=</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('/')"></button>
      </div>
   </form>
</div>

<script>
   // Vrai tant que l'écran affiche la réponse du serveur (résultat ou erreur)
   // et qu'aucun bouton n'a encore été pressé depuis.
   let reponseAffichee = {{ (result != '') | tojson }};

   /**
    * Ajoute un caractère à l'expression affichée.
    *
    * Juste après une réponse du serveur, un chiffre commence une nouvelle
    * saisie et un opérateur poursuit le calcul à partir du résultat ; un
    * message d'erreur est toujours effacé avant d'ajouter le caractère.
    * @param {string} value: Caractère à ajouter.
    * @returns {void}
    */
   function appendToDisplay(value) {
      const display = document.getElementById('display');
      if (reponseAffichee) {
         // Number() accepte tout résultat affiché (« -1.5 », « 1e+16 ») :
         // seul un message d'erreur donne NaN.
         const estErreur = Number.isNaN(Number(display.value));
         const estChiffre = /^[0-9]$/.test(value);
         if (estErreur || estChiffre) {
            display.value = '';
         }
         reponseAffichee = false;
      }
      display.value += value;
   }

   /**
    * Efface l'expression affichée afin de recommencer une saisie.
    * @returns {void}
    */
   function clearDisplay() {
      document.getElementById('display').value = '';
      reponseAffichee = false;
   }
</script>
</body>
</html>
